# E2a: E1 with 4x effective batch (524,288 padded tokens/update = 32 micro-batches of 16,384),
# same number of data epochs (2) => ~4x fewer optimizer updates than E1. LR chosen by a short probe
# (5e-5 = E1's LR vs 1e-4 = sqrt-scaled); not linearly scaled.
mode: sft
model_name_or_path: Qwen/Qwen3.5-0.8B-Base
data_dir: data/generated/abc_v2_20260915_120927
output_dir: experiments/CHANGE_ME
max_seq_len: 8192
tokens_per_micro_batch: 16384
tokens_per_update: 524288
epochs: 2
learning_rate: 5.0e-5
min_lr_ratio: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
grad_clip: 1.0
eval_every: 10
resume_every: 10
save_every: 25
eval_limit: 256
seed: 1234
