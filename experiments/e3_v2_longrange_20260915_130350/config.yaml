# E3: long-range objective. ABC-v2 whole-song SFT mixed with masked late-section reconstruction (infill) for 50% of songs (scripts/build_longrange_tasks.py); 524,288 tokens/update, LR 5e-5, 2 epochs over the mixture. max_seq_len stays 8192: the longest example is 6,733 tokens.
mode: sft
model_name_or_path: Qwen/Qwen3.5-0.8B-Base
data_dir: data/generated/abc_v2_20260915_120927
train_file: data/generated/abc_v2_20260915_120927/sft_longrange_train.jsonl
eval_file: data/generated/abc_v2_20260915_120927/sft_validation.jsonl
output_dir: experiments/CHANGE_ME
max_seq_len: 8192
tokens_per_micro_batch: 16384
tokens_per_update: 524288
epochs: 2
learning_rate: 5.0e-5
min_lr_ratio: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
grad_clip: 1.0
eval_every: 20
resume_every: 20
save_every: 50
eval_limit: 256
seed: 1234
