# R4: E3b's recipe and data with MuPT-1.07B as the base model instead of Qwen3.5-0.8B-Base. MuPT is pretrained on 10B tokens of ABC; its vocabulary was extended with the corpus's Chinese characters first (scripts/build_mupt_base.py). Tests whether a symbolic-music prior transfers to a lyrics-conditioned task.
mode: sft
model_name_or_path: models/mupt_zh_20260923
data_dir: data/generated/abc_v2_20260915_120927
train_file: data/generated/abc_v2_20260915_120927/sft_longrange_train.jsonl
eval_file: data/generated/abc_v2_20260915_120927/sft_validation.jsonl
output_dir: experiments/CHANGE_ME
max_seq_len: 8192
tokens_per_micro_batch: 16384
tokens_per_update: 131072
epochs: 2
learning_rate: 5.0e-5
min_lr_ratio: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
grad_clip: 1.0
eval_every: 50
resume_every: 50
save_every: 0
eval_limit: 256
seed: 1234
