# CSL-L2M lyrics-only retrain on OUR canonical split (same architecture/optimizer/epochs as the official
# CSLL2M_withOnlyLyrics.yaml; f_pos/f_tone False as in the released lyrics-only checkpoint). Only data paths,
# the lyric vocabulary (built from our train split), ckpt_dir and val_interval differ (upstream validate() raises
# UnboundLocalError for use_musc_ctls=False -- the shipped lyrics-only config crashes at its first validation step --
# so validation is disabled; checkpoints are still written every ckpt_interval steps).
data:
    data_dir:         /mmfs1/gscratch/scrubbed/pingw220/music_acc/Qwen-ABC-component/experiments/component_sota/csl_l2m_data/REMIaligned_events
    train_split:      /mmfs1/gscratch/scrubbed/pingw220/music_acc/Qwen-ABC-component/experiments/component_sota/csl_l2m_data/train.pkl
    val_split:        /mmfs1/gscratch/scrubbed/pingw220/music_acc/Qwen-ABC-component/experiments/component_sota/csl_l2m_data/val.pkl
    test_split:       /mmfs1/gscratch/scrubbed/pingw220/music_acc/Qwen-ABC-component/experiments/component_sota/csl_l2m_data/test.pkl
    vocab_path_melody:       /mmfs1/gscratch/scrubbed/pingw220/music_acc/MIDI-SAG/lyrics2melody_new/data/dictionary_melody.pkl
    vocab_path_lyric:       /mmfs1/gscratch/scrubbed/pingw220/music_acc/Qwen-ABC-component/experiments/component_sota/csl_l2m_data/dictionary_lyric.pkl
    max_seqs:         64                 
    enc_seqlen:       128
    dec_seqlen:       2048               
    batch_size:       4

model:
    enc_n_layer:      12
    enc_n_head:       8
    enc_d_model:      512
    enc_d_ff:         2048
    dec_n_layer:      12
    dec_n_head:       8
    dec_d_model:      512
    dec_d_ff:         2048
    d_embed:          512
    d_latent:         128
    d_ND_emb:     32
    d_Align_emb:      32
    d_PM_emb:      32
    d_DM_emb:      32
    d_PV_emb:  32
    d_PR_emb: 32
    d_DV_emb: 32
    d_DR_emb: 32
    d_MCD_emb: 32
    d_DMM_emb: 32
    d_AA_emb: 32
    d_CM_emb: 32
    d_struct_emb: 32
    d_key_emb:  32
    d_emotion_emb: 32
    d_pos_emb:  128
    d_tone_emb:  128
    d_learned_features:  128
    n_ND_cls: 64
    n_Align_cls: 64
    n_PM_cls: 64
    n_DM_cls: 64
    n_PV_cls: 64
    n_PR_cls: 64
    n_DV_cls: 64
    n_DR_cls: 64
    n_MCD_cls: 64 
    n_DMM_cls: 64
    n_AA_cls: 64
    n_CM_cls: 64
    n_struct_cls: 5
    n_key_cls: 24
    n_emotion_cls: 3
    n_pos_cls:  55
    n_tone_cls:  5
    f_key: False
    f_emotion: False
    f_struct: False
    f_Align: False
    f_ND: False
    f_PM: False
    f_PV: False
    f_PR: False
    f_DMM: False
    f_AA: False
    f_CM: False
    f_DM: False
    f_DV: False
    f_DR: False
    f_MCD: False 
    f_leared_features: False
    f_pos: False
    f_tone: False
    use_musc_ctls: False
    pretrained_params_path:      null
    pretrained_optim_path:       null

training:
    device:           cuda:0
    ckpt_dir:         /mmfs1/gscratch/scrubbed/pingw220/music_acc/Qwen-ABC-component/experiments/component_sota/runs/csl_l2m_retrain
    trained_steps:    0
    max_epochs:       12
    max_lr:           1.0e-4
    min_lr:           5.0e-6
    lr_warmup_steps:  200
    lr_decay_steps:   150000
    no_kl_steps:      10000
    kl_cycle_steps:   5000
    kl_max_beta:      1.0
    free_bit_lambda:  0.25
    constant_kl:      False
    ckpt_interval:    1000
    log_interval:     10
    val_interval:     100000000   # upstream validate() crashes when use_musc_ctls=False (batch_struct unbound): never validate

generate:
    temperature:                0.9
    nucleus_p:                  0.9
    use_latent_sampling:        False
    latent_sampling_var:        0.0
    max_seqs:                   64       # could be set to match the longest input piece during generation (inference)
    dec_seqlen:                 2048     # could be set to match the longest input piece during generation (inference)
    max_input_dec_seqlen:       2048     # should be set to equal to or less than `dec_seqlen` used during training